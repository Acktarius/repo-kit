[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "py-indexer"
version = "0.3.2"
description = "Local cross-repository lexical and structural code retrieval (SQLite FTS5 + optional MCP)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp==1.30.0",
]

[project.optional-dependencies]
structural = [
  "tree-sitter==0.26.1",
  "tree-sitter-cpp==0.23.4",
  "tree-sitter-javascript==0.25.0",
  "tree-sitter-typescript==0.23.2",
  "tree-sitter-rust==0.24.2",
]

[project.scripts]
py-indexer = "py_indexer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
py_indexer = ["default_excludes.txt"]
